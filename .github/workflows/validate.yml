name: SmartCapture validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax-and-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check extension/capture.js
          node --check extension/interaction-tracker.js
          node --check extension/popup-association.js
          node --check extension/hover-detection.js
          node --check extension/visual-diff.js
          node --check extension/popup-surface.js
          node --check extension/geometry.js
          node --check extension/layout.js
          node --check extension/popup.js
          node --check extension/background.js
      - name: Validate extension manifest
        run: node -e "const m=require('./extension/manifest.json');if(m.manifest_version!==3)process.exit(1)"
      - name: Run layout safety regressions
        run: node --test tests/layout.test.cjs tests/interaction-tracker.test.cjs tests/popup-association.test.cjs tests/hover-detection.test.cjs tests/visual-diff.test.cjs tests/popup-surface.test.cjs tests/geometry.test.cjs

  chromium-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium with system libraries
        run: npx playwright install --with-deps chromium
      - name: Run real extension hover and deduplication test
        run: node --test tests/browser.test.cjs
