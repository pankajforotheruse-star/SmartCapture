name: SmartCapture validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax-and-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check extension/capture.js
          node --check extension/interaction-tracker.js
          node --check extension/popup-association.js
          node --check extension/layout.js
          node --check extension/popup.js
          node --check extension/background.js
      - name: Validate extension manifest
        run: node -e "const m=require('./extension/manifest.json');if(m.manifest_version!==3)process.exit(1)"
      - name: Run layout safety regressions
        run: node --test tests/*.test.cjs
